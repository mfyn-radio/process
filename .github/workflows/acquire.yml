name: Acquire Bandcamp purchases

on:
  schedule:
    - cron: "17 * * * *"  # hourly
  workflow_dispatch:
    inputs:
      backlog:
        description: Also download purchases from before the start date
        type: boolean
        default: false
      dry_run:
        description: Dry run (show what would happen, change nothing)
        type: boolean
        default: false
      message_id:
        description: Only this Gmail message ID (leave empty for all)
        type: string
        default: ""

concurrency:
  group: acquire
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download new purchases into MFYN_Library
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          MESSAGE_ID: ${{ inputs.message_id }}
        run: >
          python -m intake.acquire
          ${{ inputs.backlog && '--backlog' || '' }}
          ${{ inputs.dry_run && '--dry-run' || '' }}
          ${MESSAGE_ID:+--message-id "$MESSAGE_ID"}
